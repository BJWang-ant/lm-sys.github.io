<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V4.1-Flash on H20-3e</title>
  <desc id="desc">Colocated serving uses one four-GPU worker with context-parallel prefill and query-parallel decode. Disaggregated serving uses separate four-GPU prefill and decode workers with a Mooncake state handoff.</desc>
  <rect width="960" height="460" rx="24" fill="#101c30"/>
  <g font-family="system-ui, sans-serif">
    <text x="45" y="55" fill="#fff" font-size="33" font-weight="700">DeepSeek-V4.1-Flash on H20-3e</text>
    <text x="47" y="87" fill="#b9c9e1" font-size="18">Prefill and decode layouts in SGLang</text>

    <rect x="45" y="120" width="870" height="129" rx="14" fill="#1d2d47"/>
    <text x="67" y="151" fill="#fff" font-size="19" font-weight="700">Colocated · one 4-GPU worker</text>
    <rect x="67" y="173" width="350" height="51" rx="9" fill="#b0e4d8"/>
    <text x="242" y="205" text-anchor="middle" fill="#113d37" font-size="18">Prefill · split prompt rows (CP)</text>
    <path d="M433 199h87m-11-8 11 8-11 8" fill="none" stroke="#b9c9e1" stroke-width="2.5"/>
    <rect x="538" y="173" width="350" height="51" rx="9" fill="#c8dbfb"/>
    <text x="713" y="205" text-anchor="middle" fill="#193b69" font-size="18">Decode · split query rows (DP)</text>

    <rect x="45" y="270" width="870" height="141" rx="14" fill="#1d2d47"/>
    <text x="67" y="302" fill="#fff" font-size="19" font-weight="700">Disaggregated · 4 prefill GPUs + 4 decode GPUs</text>
    <rect x="67" y="324" width="305" height="60" rx="9" fill="#b0e4d8"/>
    <text x="219" y="361" text-anchor="middle" fill="#113d37" font-size="18">Prefill worker · CP4</text>
    <path d="M388 364h181m-11-8 11 8-11 8" fill="none" stroke="#b9c9e1" stroke-width="2.5"/>
    <text x="478" y="350" text-anchor="middle" fill="#b9c9e1" font-size="15">Mooncake KV handoff</text>
    <rect x="588" y="324" width="300" height="60" rx="9" fill="#c8dbfb"/>
    <text x="738" y="361" text-anchor="middle" fill="#193b69" font-size="18">Decode worker · DP4</text>
  </g>
</svg>
